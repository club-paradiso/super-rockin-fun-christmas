name: PR61 compatibility formatting
on:
  pull_request:
    types: [synchronize]
permissions:
  contents: write
jobs:
  format:
    if: ${{ github.event.pull_request.number == 61 && github.event.pull_request.head.repo.full_name == 'club-paradiso/super-rockin-fun-christmas' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write components/kiosk/kiosk-app.tsx tests/unit/legacy-ios.test.ts
      - name: Commit only the two formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/kiosk/kiosk-app.tsx tests/unit/legacy-ios.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(kiosk): format Safari 15 compatibility changes"
            git fetch origin fix/ipad-mini4-ios15-kiosk-compat-20261117
            git rebase origin/fix/ipad-mini4-ios15-kiosk-compat-20261117
            git push origin HEAD:fix/ipad-mini4-ios15-kiosk-compat-20261117
          fi
