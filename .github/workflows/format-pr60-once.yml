# Temporary formatter for PR #60. Delete after the formatting commit lands.
name: PR60 format once
on:
  pull_request:
    types: [synchronize]
permissions:
  contents: write
jobs:
  format:
    if: ${{ github.event.pull_request.number == 60 && github.event.pull_request.head.repo.full_name == 'club-paradiso/super-rockin-fun-christmas' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format only changed source and documentation
        run: |
          npx prettier --write components/kiosk/kiosk-app.tsx lib/kiosk/machine.ts tests/unit/kiosk-machine.test.ts docs/DECISIONS.md docs/DEVICE_ACCEPTANCE.md docs/REMOTE_CAMERA.md docs/STATUS.md
      - name: Commit only format changes on this same-repository PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/kiosk/kiosk-app.tsx lib/kiosk/machine.ts tests/unit/kiosk-machine.test.ts docs/DECISIONS.md docs/DEVICE_ACCEPTANCE.md docs/REMOTE_CAMERA.md docs/STATUS.md
          if ! git diff --cached --quiet; then
            git commit -m "style: apply Prettier to kiosk flash and extra-shot changes"
            git push origin HEAD:feat/kiosk-screen-flash-one-extra-shot-20261116
          fi
