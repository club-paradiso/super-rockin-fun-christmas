name: D105 format diagnostic
on:
  push:
    branches:
      - feat/journal-ux-alignment-motion-qa-20261117
jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Show formatting differences
        run: |
          for FILE in app/globals.css e2e/journal-ux.spec.ts; do
            npx prettier "$FILE" > /tmp/d105-prettier
            diff -u "$FILE" /tmp/d105-prettier || true
          done
