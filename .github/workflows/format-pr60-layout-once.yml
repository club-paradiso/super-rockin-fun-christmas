# Temporary formatting helper for PR #60; removed in the next commit.
name: PR60 layout format once
on:
  pull_request:
    types: [synchronize]
permissions:
  contents: write
jobs:
  format:
    if: ${{ github.event.pull_request.number == 60 && github.event.pull_request.head.repo.full_name == 'club-paradiso/super-rockin-fun-christmas' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write app/globals.css components/kiosk/kiosk-app.tsx lib/kiosk/tap-guard.ts tests/unit/tap-guard.test.ts e2e/kiosk-control-visibility.spec.ts
      - name: Commit only format changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/globals.css components/kiosk/kiosk-app.tsx lib/kiosk/tap-guard.ts tests/unit/tap-guard.test.ts e2e/kiosk-control-visibility.spec.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(kiosk): format tablet layout and touch fixes"
            git push origin HEAD:feat/kiosk-screen-flash-one-extra-shot-20261116
          fi
