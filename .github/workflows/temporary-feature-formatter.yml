name: Temporary branch formatter
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/six-shots-flexible-selection'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format only modified source and tests
        run: |
          npx prettier --write README.md components/kiosk/kiosk-app.tsx config/frames/flexible-strips.ts e2e/cloud.spec.ts e2e/kiosk.spec.ts e2e/screenshots.spec.ts tests/unit/compositor.test.ts tests/unit/kiosk-machine.test.ts tests/unit/mock-flow.test.ts
      - name: Push formatting to this feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md components/kiosk/kiosk-app.tsx config/frames/flexible-strips.ts e2e/cloud.spec.ts e2e/kiosk.spec.ts e2e/screenshots.spec.ts tests/unit/compositor.test.ts tests/unit/kiosk-machine.test.ts tests/unit/mock-flow.test.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'style: format six-shot kiosk feature'
          git push origin HEAD:"${GITHUB_HEAD_REF}"
