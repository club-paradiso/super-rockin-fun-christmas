name: Journal format diagnostic
on:
  push:
    branches:
      - feat/studio-shalom-journal-motion-20261117
jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Show exact formatting differences
        run: |
          npx prettier app/globals.css > /tmp/formatted.css
          diff -u app/globals.css /tmp/formatted.css || true
