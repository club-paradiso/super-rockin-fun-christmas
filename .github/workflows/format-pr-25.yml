name: Format PR 25 integration
on:
  push:
    branches: [feat/six-shots-flexible-selection]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply repository Prettier rules to integration changes
        run: |
          npx prettier --write \
            components/kiosk/kiosk-app.tsx \
            config/frames/index.ts config/frames/flexible-strips.ts config/kiosk.ts \
            lib/kiosk/machine.ts tests/unit/frames.test.ts \
            tests/unit/kiosk-machine.test.ts tests/unit/mock-flow.test.ts \
            tests/unit/compositor.test.ts \
            e2e/helpers.ts e2e/browser-camera.spec.ts e2e/cloud.spec.ts \
            e2e/kiosk.spec.ts e2e/offline.spec.ts e2e/screenshots.spec.ts \
            e2e/staff-helpers.ts e2e/wall-scene.spec.ts e2e/admin.spec.ts
      - name: Commit only formatter output
        run: |
          git diff --stat
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add components/kiosk/kiosk-app.tsx config/frames/index.ts \
              config/frames/flexible-strips.ts config/kiosk.ts lib/kiosk/machine.ts \
              tests/unit/frames.test.ts tests/unit/kiosk-machine.test.ts \
              tests/unit/mock-flow.test.ts tests/unit/compositor.test.ts \
              e2e/helpers.ts e2e/browser-camera.spec.ts e2e/cloud.spec.ts \
              e2e/kiosk.spec.ts e2e/offline.spec.ts e2e/screenshots.spec.ts \
              e2e/staff-helpers.ts e2e/wall-scene.spec.ts e2e/admin.spec.ts
            git commit -m "style: format six-shot integration with repository Prettier rules"
            git push origin HEAD:refs/heads/feat/six-shots-flexible-selection
          fi
