<svg xmlns="http://www.w3.org/2000/svg" width="44" height="96" viewBox="0 0 44 96">
  <!-- A strip of cream masking tape folded over the line (y = 34) and pressed onto the photo's top.
       Light from the top left: its faint shadow falls down and to the right. -->
  <defs>
    <linearGradient id="fold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#5a4128" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="0.72" stop-color="#5a4128" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a6b45" stop-opacity="0.16"/>
      <stop offset="0.12" stop-color="#8a6b45" stop-opacity="0"/>
      <stop offset="0.88" stop-color="#8a6b45" stop-opacity="0"/>
      <stop offset="1" stop-color="#8a6b45" stop-opacity="0.18"/>
    </linearGradient>
    <clipPath id="strip">
      <path id="shape" d="M4 3.2 L7 1.4 L10.4 3 L13.6 0.9 L17.2 2.6 L20.6 0.6 L24 2.4 L27.6 0.8 L31 2.8 L34.4 1 L37.6 2.9 L40 1.5 L40 92.6 L37 94.6 L33.6 92.8 L30.2 95 L26.8 93 L23.4 95.2 L20 93.1 L16.4 95 L13 92.9 L9.6 94.8 L6.6 93 L4 94.7 Z"/>
    </clipPath>
  </defs>
  <!-- shadow on what is under the tape -->
  <use href="#shape" transform="translate(1.6 2.2)" fill="#2b1a10" opacity="0.14"/>
  <g clip-path="url(#strip)">
    <rect x="0" y="0" width="44" height="96" fill="#eee0c2" fill-opacity="0.86"/>
    <!-- paper fibre: faint lengthwise streaks -->
    <g stroke="#c9b48f" stroke-opacity="0.22" stroke-width="0.6">
      <path d="M9 0V96M15.5 0V96M22 0V96M28.5 0V96M35 0V96"/>
    </g>
    <g stroke="#fffaf0" stroke-opacity="0.35" stroke-width="0.5">
      <path d="M12 0V96M18.8 0V96M25.3 0V96M31.8 0V96"/>
    </g>
    <rect x="0" y="0" width="44" height="96" fill="url(#edge)"/>
    <!-- the bulge where it wraps the line -->
    <rect x="0" y="27" width="44" height="15" fill="url(#fold)"/>
  </g>
</svg>
