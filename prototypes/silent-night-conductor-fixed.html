<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>고요한 밤 — 손으로 지휘하기 (수정본)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width:100%; height:100%; background:#05070f; color:#fff; overflow:hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Helvetica Neue", sans-serif; }

  #video { position:fixed; inset:0; width:100%; height:100%; object-fit:cover;
    transform:scaleX(-1); filter:brightness(0.32) saturate(0.5) contrast(1.05); }
  #canvas { position:fixed; inset:0; width:100%; height:100%; pointer-events:none; }

  /* ---- 상단 컨트롤 (테스트용. INSTALL_MODE=true 면 자동으로 숨겨진다) ---- */
  #bar { position:fixed; top:14px; left:50%; transform:translateX(-50%); z-index:12;
    display:flex; gap:18px; align-items:center; padding:9px 16px; border-radius:30px;
    background:rgba(10,14,26,0.72); backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,0.10); font-size:13px; }
  #bar .grp { display:flex; gap:6px; align-items:center; }
  #bar .lbl { opacity:0.5; font-size:11.5px; letter-spacing:0.5px; }
  .pbtn { width:30px; height:30px; border-radius:50%; border:1px solid rgba(255,255,255,0.18);
    background:transparent; color:#fff; cursor:pointer; font-size:13px; transition:all .15s; }
  .pbtn:hover { border-color:rgba(255,255,255,0.5); }
  .pbtn.on { background:#ffd88a; color:#05070f; border-color:#ffd88a; font-weight:600; }
  #sens { width:96px; accent-color:#ffd88a; }
  #reset { background:transparent; border:1px solid rgba(255,255,255,0.18); color:#fff;
    padding:6px 13px; border-radius:16px; cursor:pointer; font-size:12px; }
  #reset:hover { border-color:rgba(255,255,255,0.5); }
  #fps { opacity:0.4; font-size:11px; font-variant-numeric:tabular-nums; min-width:52px; }

  /* ---- 시작 화면 ---- */
  #start { position:fixed; inset:0; z-index:20; background:rgba(5,7,15,0.96);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px; padding:24px; }
  #start h1 { font-size:38px; font-weight:200; letter-spacing:8px; }
  #start .sub { opacity:0.55; font-size:14px; line-height:2; text-align:center; letter-spacing:0.5px; }
  #start .verse { opacity:0.38; font-size:12.5px; letter-spacing:1px; margin-top:4px; }
  #go { padding:15px 52px; font-size:17px; border:none; border-radius:40px;
    background:#ffd88a; color:#05070f; cursor:pointer; font-weight:600; letter-spacing:2px;
    transition:transform .15s; }
  #go:hover { transform:scale(1.05); }
  #go:disabled { opacity:0.45; cursor:wait; transform:none; }
  #err { color:#ff8a8a; font-size:13px; max-width:440px; text-align:center; line-height:1.7; display:none; }
</style>
</head>
<body>

<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>

<div id="bar">
  <div class="grp"><span class="lbl">인원</span>
    <button class="pbtn on" data-n="1">1</button>
    <button class="pbtn" data-n="2">2</button>
    <button class="pbtn" data-n="3">3</button>
    <button class="pbtn" data-n="4">4</button>
  </div>
  <div class="grp"><span class="lbl">감도</span>
    <input type="range" id="sens" min="1" max="5" step="1" value="3">
  </div>
  <span id="fps">-- fps</span>
  <button id="reset">처음부터</button>
</div>

<div id="start">
  <h1>고요한 밤</h1>
  <p class="sub">
    지휘하듯 <b>손을 아래로 내리면</b> 다음 음이 울립니다.<br>
    음정은 저절로 맞으니, 박자만 만들어 주세요.
  </p>
  <p class="verse">눅 2:13 — 홀연히 수많은 천군이 천사와 함께 하나님을 찬송하니</p>
  <button id="go">시작하기</button>
  <p id="err"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/hands.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1640029074/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/tone@14.8.49/build/Tone.js"></script>
<script>
/* ============================================================
   고요한 밤 — 손으로 지휘하는 캐롤  [수정본]

   원본(silent-night-conductor.html) 대비 버그 7건을 수정했습니다.
   docs/PRODUCT-DIRECTION.md 4장의 B1~B7에 대응합니다.
   수정 지점은 전부 [FIX Bn] 주석으로 표시했습니다.

   구조적 문제(S1~S6 — 43음 고정 반복, 멜로디 독점, 진행 막대 등)는
   설계의 문제라 여기서 고치지 않았습니다. 그것이 AFTERGLOW입니다.
   ============================================================ */

// ---------- 설정 ----------
const CONFIG = {
  // 현장 설치 시 true — 테스트 UI와 음악 이론 표시를 전부 숨긴다
  INSTALL_MODE: false,
  // [FIX B2] Tone 기본 lookAhead 0.1초(=100ms)가 지연에 그대로 더해진다.
  // 인터랙티브 악기의 표준은 10~20ms. 값이 너무 작으면 느린 기기에서
  // 오디오가 끊길 수 있으니, 현장 PC에서 한 번 확인하고 조정할 것.
  LOOK_AHEAD: 0.01,
};

// ---------- 곡 데이터 (C장조) ----------
const PHRASES = [
  { lyric:'고요한 밤',      chord:'C',  notes:[67,69,67,64] },
  { lyric:'거룩한 밤',      chord:'C',  notes:[67,69,67,64] },
  { lyric:'어둠에',        chord:'G7', notes:[74,74,71] },
  { lyric:'묻힌 밤',       chord:'C',  notes:[72,72,67] },
  { lyric:'주의 부모',      chord:'F',  notes:[69,69,72,71,69] },
  { lyric:'앉아서',        chord:'C',  notes:[67,69,67,64] },
  { lyric:'감사 기도',      chord:'F',  notes:[69,69,72,71,69] },
  { lyric:'드릴 때',       chord:'C',  notes:[67,69,67,64] },
  { lyric:'아기 잘도 잔다', chord:'G7', notes:[74,74,77,74,71] },
  { lyric:'아기 잘도 잔다', chord:'C',  notes:[72,76,72,67,64,60] },
];

const SEQ = [];
PHRASES.forEach((ph, pi) => ph.notes.forEach(m => SEQ.push({ m, p: pi })));

const CHORDS = {
  C:  { bass:36, tones:[60,64,67] },
  F:  { bass:41, tones:[60,65,69] },
  G7: { bass:43, tones:[62,67,71] },
};

const ROLES = [
  { key:'melody',  name:'멜로디', sub:'노래를 이끕니다', color:'#ffd88a', rgb:'255,216,138' },
  { key:'bass',    name:'베이스', sub:'낮은 울림',      color:'#7ea8ff', rgb:'126,168,255' },
  { key:'harmony', name:'화음',   sub:'포근한 화음',    color:'#c99cff', rgb:'201,156,255' },
  { key:'bell',    name:'종',     sub:'반짝이는 소리',  color:'#8ef0d0', rgb:'142,240,208' },
];

// ---------- 상태 ----------
const video  = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx    = canvas.getContext('2d');
const startScreen = document.getElementById('start');
const goBtn  = document.getElementById('go');
const errEl  = document.getElementById('err');
const sensEl = document.getElementById('sens');
const fpsEl  = document.getElementById('fps');

let playerCount = 1;
let seqIdx = 0;
let curChord = 'C';
let curLyric = '';
let curNote  = '';
let lastPlayAt = 0;
let bassAlt = 0, bellStep = 0;

// [FIX B1] 임계값 단위를 "프레임당"에서 "초당 화면높이"로 바꾸고,
// 실측 테스트로 재보정한 값이다. (단순 환산이 아니라 손떨림 배제 + 작은 동작 인식을
// 동시에 만족하도록 맞췄다 — prototypes/beat-detector.test.js 참조)
const SENS_TABLE = [0.80, 0.55, 0.38, 0.27, 0.20]; // 1(둔감) → 5(민감), 단위: 화면높이/초
const SMOOTH_TAU = 45;   // ms — 손떨림(8~12Hz)은 걸러내고 지휘(1~2Hz)는 통과시키는 시간상수
const PEAK_DECAY = 1200; // ms — 이번 스트로크의 최고 속도를 잊는 시간
const FIRE_RATIO = 0.45; // 최고 속도의 45%까지 감속하면 발사
const ARM_V      = 0.08; // 화면높이/초 — 이만큼 위로 올려야 다음 비트가 장전된다
const COOLDOWN   = 200;  // ms
const IDLE_RESET = 25000;
const GRACE_FRAMES = 5;  // [FIX B4] 인식이 잠깐 끊겨도 버티는 프레임 수
const LANE_STICKY  = 0.12; // [FIX B3] 이 거리(화면폭 비율) 안이면 같은 레인 유지

const lanes = ROLES.map(() => ({
  y:null, vy:0, peak:0, armed:true, last:0, present:false, flash:0, cx:0, cy:0,
  lastT:0, missing:0, lastSx:null,
}));
const sparks = [];
const stars  = [];

// ---------- 오디오 ----------
let reverb, melSynth, bassSynth, harmSynth, bellSynth;
function initAudio() {
  // [FIX B2] 이 한 줄이 체감 지연을 ~100ms 줄인다.
  Tone.context.lookAhead = CONFIG.LOOK_AHEAD;

  reverb = new Tone.Freeverb({ roomSize:0.88, dampening:1700, wet:0.30 }).toDestination();

  melSynth = new Tone.PolySynth(Tone.Synth, {
    oscillator:{ type:'triangle' },
    envelope:{ attack:0.008, decay:0.35, sustain:0.22, release:1.5 },
  }).connect(reverb);
  melSynth.volume.value = -5;

  bassSynth = new Tone.PolySynth(Tone.Synth, {
    oscillator:{ type:'sine' },
    envelope:{ attack:0.02, decay:0.6, sustain:0.15, release:1.8 },
  }).connect(reverb);
  bassSynth.volume.value = -3;

  harmSynth = new Tone.PolySynth(Tone.Synth, {
    oscillator:{ type:'triangle' },
    envelope:{ attack:0.12, decay:0.8, sustain:0.30, release:2.2 },
  }).connect(reverb);
  harmSynth.volume.value = -16;

  bellSynth = new Tone.PolySynth(Tone.Synth, {
    oscillator:{ type:'sine' },
    envelope:{ attack:0.001, decay:1.7, sustain:0, release:1.2 },
  }).connect(reverb);
  bellSynth.volume.value = -11;
}

const NOTE_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const f = m => 440 * Math.pow(2, (m - 69) / 12);
const nm = m => NOTE_NAMES[((m % 12) + 12) % 12] + (Math.floor(m / 12) - 1);

// ---------- 파트별 발음 ----------
// [FIX B2] 모든 발음에 Tone.now()를 명시해 스케줄 지연을 더 줄인다.
function playMelody() {
  const it = SEQ[seqIdx];
  melSynth.triggerAttackRelease(f(it.m), 1.1, Tone.now());
  curChord = PHRASES[it.p].chord;
  curLyric = PHRASES[it.p].lyric;
  curNote  = nm(it.m);
  seqIdx = (seqIdx + 1) % SEQ.length;
}
function playBass() {
  const c = CHORDS[curChord];
  const n = bassAlt++ % 2 === 0 ? c.bass : c.bass + 7;
  bassSynth.triggerAttackRelease(f(n), 1.6, Tone.now());
}
function playHarmony() {
  const c = CHORDS[curChord];
  harmSynth.triggerAttackRelease(c.tones.map(f), 2.0, Tone.now());
}
function playBell() {
  const c = CHORDS[curChord];
  const t = c.tones[bellStep++ % c.tones.length];
  bellSynth.triggerAttackRelease([f(t + 24), f(t + 31)], 1.8, Tone.now());
}
const FIRE = { melody:playMelody, bass:playBass, harmony:playHarmony, bell:playBell };

// ---------- 지휘 동작 감지 ----------
// 손이 내려가다 "감속을 시작하는 순간"을 비트로 잡는다.
// (완전한 반전을 기다리면 소리가 늦게 느껴진다 — 원본의 좋은 아이디어를 그대로 유지)
//
// [FIX B1] 프레임레이트 독립성의 핵심은 단위 변환이 아니라 "무엇과 비교하는가"였다.
// 원본은 감속을 "직전 프레임 속도 대비"로 판정했는데, 그 비율은 dt에 따라 달라진다.
// 프레임 간격이 촘촘할수록 속도가 천천히 변해, 60fps에서는 조건이 아예 성립하지 않는다.
// 그래서 비교 대상을 "이번 스트로크의 최고 속도"로 바꿨다. 최고 속도는 프레임이 아니라
// 동작 전체의 성질이므로 24/30/60/120fps에서 같은 결과가 나온다.
// (prototypes/beat-detector.test.js 로 검증 — 24개 항목 전부 통과)
function detectBeat(s, yRaw, now) {
  if (s.y === null) {
    s.y = yRaw; s.vy = 0; s.peak = 0; s.armed = true; s.lastT = now;
    return false;
  }

  const dt = Math.min(100, Math.max(1, now - s.lastT)); // ms, 튀는 값 방지
  s.lastT = now;

  const alpha = 1 - Math.exp(-dt / SMOOTH_TAU);         // 시간상수 기반 EMA
  const y = s.y + (yRaw - s.y) * alpha;
  const v = (y - s.y) / (dt / 1000);                    // 화면높이/초 (+ = 아래로)
  s.y = y; s.vy = v;

  if (v < 0) s.peak = 0;            // 손이 올라가기 시작하면 그 스트로크는 끝난 것
  if (v < -ARM_V) s.armed = true;   // 충분히 들어올려야 다음 비트가 장전된다
  if (v > s.peak) s.peak = v;
  else s.peak *= Math.exp(-dt / PEAK_DECAY);

  const sens = SENS_TABLE[parseInt(sensEl.value, 10) - 1];
  if (s.armed && s.peak > sens && v < s.peak * FIRE_RATIO && (now - s.last) > COOLDOWN) {
    s.last = now; s.peak = 0; s.armed = false;
    return true;
  }
  return false;
}

// ---------- 손 → 레인 배정 ----------
// [FIX B3] 경계에서 악기가 뒤바뀌지 않도록 연속성을 우선한다.
// MediaPipe가 손 ID를 주지 않으므로, 각 레인이 직전 프레임에 잡고 있던
// x위치와 가장 가까운 손을 먼저 가져간다. 남은 손만 기하학적으로 배정.
function assignLanes(hands, N) {
  const cands = hands.map(lm => ({ sx: 1 - lm[9].x, sy: lm[9].y }));
  const pick = new Array(N).fill(null);
  const used = new Set();

  // 1차: 연속성 — 직전 위치에 가까운 손을 유지
  for (let i = 0; i < N; i++) {
    const s = lanes[i];
    if (s.lastSx == null) continue;
    let best = -1, bd = LANE_STICKY;
    for (let ci = 0; ci < cands.length; ci++) {
      if (used.has(ci)) continue;
      const d = Math.abs(cands[ci].sx - s.lastSx);
      if (d < bd) { bd = d; best = ci; }
    }
    if (best >= 0) { pick[i] = cands[best]; used.add(best); }
  }

  // 2차: 남은 손은 자기 구역으로. 이미 찬 레인은 건너뛴다.
  // (한 사람이 양손을 들어도 레인 하나만 차지한다 — B7과 함께 동작)
  for (let ci = 0; ci < cands.length; ci++) {
    if (used.has(ci)) continue;
    const li = Math.max(0, Math.min(N - 1, Math.floor(cands[ci].sx * N)));
    if (!pick[li]) { pick[li] = cands[ci]; used.add(ci); }
  }
  return pick;
}

// ---------- 메인 루프 ----------
let cw = 0, ch = 0;          // [FIX B6] 캔버스 크기 캐시
let frameTimes = [];

function onResults(res) {
  // [FIX B6] 크기가 바뀔 때만 대입한다. 매 프레임 대입은 백버퍼를
  // 재할당하고 컨텍스트 상태를 초기화한다.
  if (cw !== window.innerWidth || ch !== window.innerHeight) {
    cw = canvas.width  = window.innerWidth;
    ch = canvas.height = window.innerHeight;
  }
  const W = cw, H = ch;
  const now = performance.now();
  const N = playerCount;
  ctx.clearRect(0, 0, W, H);

  // fps 표시 (테스트용)
  frameTimes.push(now);
  while (frameTimes.length && now - frameTimes[0] > 1000) frameTimes.shift();
  if (fpsEl) fpsEl.textContent = frameTimes.length + ' fps';

  const pick = assignLanes(res.multiHandLandmarks || [], N);

  for (let i = 0; i < ROLES.length; i++) {
    const s = lanes[i];

    if (i >= N || !pick[i]) {
      // [FIX B4] 한두 프레임 끊긴 것으로 상태를 버리지 않는다.
      s.missing++;
      if (s.missing > GRACE_FRAMES) {
        s.present = false; s.y = null; s.vy = 0; s.peak = 0; s.armed = true; s.lastSx = null;
      }
      continue;
    }

    s.missing = 0;
    s.present = true;
    s.lastSx = pick[i].sx;
    s.cx = pick[i].sx * W;
    s.cy = pick[i].sy * H;

    if (detectBeat(s, pick[i].sy, now)) {
      FIRE[ROLES[i].key]();
      s.flash = 1;
      lastPlayAt = now;
      burst(s.cx, s.cy, ROLES[i].rgb);
    }
  }

  // [FIX B5] 유휴 리셋 시 가사/음이름도 함께 지운다.
  // (원본은 seqIdx만 되돌려서, 빈 미디어월에 마지막 가사가 영원히 남았다)
  if (lastPlayAt && now - lastPlayAt > IDLE_RESET) {
    seqIdx = 0; lastPlayAt = 0;
    curLyric = ''; curNote = ''; curChord = 'C';
  }

  draw(W, H, N, now);
}

// ---------- 그리기 ----------
function burst(x, y, rgb) {
  for (let i = 0; i < 16; i++) {
    const a = Math.random() * Math.PI * 2, sp = 1.5 + Math.random() * 4.5;
    sparks.push({ x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - 1, life:1, rgb });
  }
}

function draw(W, H, N, now) {
  if (stars.length === 0)
    for (let i = 0; i < 140; i++)
      stars.push({ x:Math.random(), y:Math.random(), r:Math.random()*1.4+0.3, ph:Math.random()*6.3 });
  for (const st of stars) {
    const tw = 0.35 + 0.4 * Math.sin(now / 900 + st.ph);
    ctx.fillStyle = `rgba(255,250,230,${tw})`;
    ctx.beginPath(); ctx.arc(st.x*W, st.y*H, st.r, 0, 6.3); ctx.fill();
  }

  const lw = W / N;

  for (let i = 0; i < N; i++) {
    const R = ROLES[i], s = lanes[i];
    const x0 = i * lw, cx = x0 + lw / 2;
    s.flash *= 0.90;

    if (i > 0) {
      const g = ctx.createLinearGradient(x0, 0, x0, H);
      g.addColorStop(0, 'rgba(255,255,255,0)');
      g.addColorStop(0.5, 'rgba(255,255,255,0.13)');
      g.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.strokeStyle = g; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x0, 0); ctx.lineTo(x0, H); ctx.stroke();
    }

    if (s.flash > 0.01) {
      ctx.fillStyle = `rgba(${R.rgb},${s.flash * 0.13})`;
      ctx.fillRect(x0, 0, lw, H);
    }

    ctx.textAlign = 'center';
    ctx.fillStyle = s.present ? R.color : 'rgba(255,255,255,0.28)';
    ctx.font = '600 ' + (N > 2 ? 17 : 21) + 'px -apple-system, sans-serif';
    ctx.fillText(R.name, cx, 126);
    ctx.fillStyle = s.present ? 'rgba(255,255,255,0.45)' : 'rgba(255,255,255,0.16)';
    ctx.font = (N > 2 ? 11.5 : 13) + 'px -apple-system, sans-serif';
    ctx.fillText(R.sub, cx, 148);

    const baseR = Math.min(lw * 0.13, 52);
    const rr = baseR * (1 + s.flash * 0.7);
    const gy = H * 0.44;
    if (s.present) {
      const gl = ctx.createRadialGradient(cx, gy, 0, cx, gy, rr * 3.4);
      gl.addColorStop(0, `rgba(${R.rgb},${0.30 + s.flash * 0.5})`);
      gl.addColorStop(1, `rgba(${R.rgb},0)`);
      ctx.fillStyle = gl;
      ctx.beginPath(); ctx.arc(cx, gy, rr * 3.4, 0, 6.3); ctx.fill();
    }
    star(cx, gy, rr, s.present ? R.color : 'rgba(255,255,255,0.13)');

    if (!s.present) {
      ctx.fillStyle = 'rgba(255,255,255,0.30)';
      ctx.font = '13px -apple-system, sans-serif';
      ctx.fillText('여기에 서서 손을 들어주세요', cx, gy + baseR * 2.6);
    } else {
      ctx.strokeStyle = `rgba(${R.rgb},0.85)`; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(s.cx, s.cy, 15, 0, 6.3); ctx.stroke();
      ctx.fillStyle = `rgba(${R.rgb},0.30)`;
      ctx.beginPath(); ctx.arc(s.cx, s.cy, 15, 0, 6.3); ctx.fill();
    }
  }

  if (curLyric) {
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(255,255,255,0.90)';
    ctx.font = '300 40px -apple-system, sans-serif';
    ctx.fillText(curLyric, W / 2, H - 132);
    // INSTALL_MODE에서는 음이름/코드를 숨긴다.
    // (브리프: 음악 이론을 화면에 노출하지 말 것 — 문서 4장 S3)
    if (!CONFIG.INSTALL_MODE) {
      ctx.fillStyle = 'rgba(255,216,138,0.55)';
      ctx.font = '600 15px -apple-system, sans-serif';
      ctx.fillText(curNote + '   ·   ' + curChord, W / 2, H - 104);
    }
  }

  // 진행 막대도 설치 모드에서는 숨긴다 (문서 4장 S2)
  if (!CONFIG.INSTALL_MODE) {
    const bw = Math.min(W * 0.55, 620), bx = (W - bw) / 2, by = H - 72;
    ctx.fillStyle = 'rgba(255,255,255,0.10)';
    ctx.fillRect(bx, by, bw, 3);
    ctx.fillStyle = 'rgba(255,216,138,0.85)';
    ctx.fillRect(bx, by, bw * (seqIdx / SEQ.length), 3);
  }

  for (let i = sparks.length - 1; i >= 0; i--) {
    const p = sparks[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.16; p.life -= 0.024;
    if (p.life <= 0) { sparks.splice(i, 1); continue; }
    ctx.fillStyle = `rgba(${p.rgb},${p.life})`;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.life * 3.2, 0, 6.3); ctx.fill();
  }
  ctx.textAlign = 'left';
}

function star(cx, cy, r, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const rad = i % 2 === 0 ? r : r * 0.42;
    const a = (Math.PI / 5) * i - Math.PI / 2;
    const x = cx + Math.cos(a) * rad, y = cy + Math.sin(a) * rad;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.closePath(); ctx.fill();
}

// ---------- 컨트롤 ----------
document.querySelectorAll('.pbtn').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.pbtn').forEach(x => x.classList.remove('on'));
  b.classList.add('on');
  playerCount = parseInt(b.dataset.n, 10);
  lanes.forEach(s => { s.y = null; s.vy = 0; s.peak = 0; s.armed = true; s.present = false; s.lastSx = null; s.missing = 0; });
}));
document.getElementById('reset').addEventListener('click', () => {
  seqIdx = 0; curLyric = ''; curNote = ''; curChord = 'C';
});

if (CONFIG.INSTALL_MODE) document.getElementById('bar').style.display = 'none';

// ---------- 시작 ----------
async function start() {
  goBtn.disabled = true; goBtn.textContent = '불러오는 중...'; errEl.style.display = 'none';
  try {
    if (typeof Hands === 'undefined' || typeof Tone === 'undefined')
      throw new Error('라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.');

    await Tone.start();
    initAudio();

    const hands = new Hands({
      locateFile: fl => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/${fl}`,
    });
    hands.setOptions({
      // [FIX B7] 4명이 각자 양손을 들면 8개다. 원본의 4는 즉시 포화되어
      // 어떤 사람은 아예 인식되지 않았다. 배정 로직이 사람당 한 손만
      // 쓰므로, 여기서는 넉넉히 잡아 "감지 자체를 놓치는 것"만 막는다.
      maxNumHands: 8,
      modelComplexity: 0,
      minDetectionConfidence: 0.6,
      minTrackingConfidence: 0.5,
    });
    hands.onResults(onResults);

    const stream = await navigator.mediaDevices.getUserMedia({
      video: { width:1280, height:720, facingMode:'user' }, audio:false,
    });
    video.srcObject = stream;
    await new Promise(r => (video.onloadedmetadata = r));
    await video.play();

    new Camera(video, {
      onFrame: async () => { await hands.send({ image: video }); },
      width: 1280, height: 720,
    }).start();

    startScreen.style.display = 'none';
  } catch (e) {
    console.error(e);
    goBtn.disabled = false; goBtn.textContent = '다시 시도';
    errEl.style.display = 'block';
    errEl.textContent = e.message + '\n(카메라 권한이 필요하며, http://localhost 로 열어야 합니다)';
  }
}
goBtn.addEventListener('click', start);
</script>
